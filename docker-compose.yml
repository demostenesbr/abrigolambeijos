version: '3.9'

services: 
  mysql: 
    image: mysql:8.0
    container_name: mysql_lambejos
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mydatabase
      MYSQL_USER: myuser
    ports:
      - "3306:3306"
    phpmyadmin:
      image: phpmyadmin/phpmyadmin
      container_name: phpmyadmin_lambejos
      restart: always
      environment:
        PMA_HOST: mysql
        PMA_PORT: 3306
      ports:
        - "8080:80"
      volumes:
        - ./phpmyadmin/config.user.inc.php:/etc/phpmyadmin/config.user.inc.php
      heauthcheck:
        test: ["CMD", "curl", "-f", "http://localhost"]
        interval: 30s
        timeout: 10s
        retries: 5
      networks:
        - lambeijos-network
    
    volumes:
      mysql_data:
        driver: local
      
    networks:
      lambeijos-network:
        driver: bridge
