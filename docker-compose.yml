services:
  db:
    image: postgres:16-alpine
    container_name: abrigolambeijos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-abrigolambeijos}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-abrigolambeijos}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: abrigolambeijos-backend
    restart: unless-stopped
    working_dir: /usr/src/app
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/abrigolambeijos}
      PORT: ${PORT:-3001}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"
    volumes:
      - ./apps/backend:/usr/src/app
    command: sh -c "npm install && npm run start:dev"

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: abrigolambeijos-frontend
    restart: unless-stopped
    working_dir: /usr/src/app
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:3001}
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ./apps/frontend:/usr/src/app
    command: sh -c "npm install && npm run dev"

  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
    container_name: abrigolambeijos-admin
    restart: unless-stopped
    working_dir: /usr/src/app
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./apps/admin:/usr/src/app
    command: sh -c "npm install && npm run dev"

volumes:
  postgres_data:
